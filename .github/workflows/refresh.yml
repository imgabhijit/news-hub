name: Refresh Videos

on:
  schedule:
    - cron: '0 */2 * * *'  # every 2 hours
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit updated JSON files

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install google-api-python-client python-dotenv

      # A manually re-run workflow can start from an older commit. Sync first so
      # the fetch and its cache use the newest generated data.
      - name: Sync latest data
        run: git pull --rebase origin main

      - name: Run fetcher
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/channels_meta.json data/video_id_cache.json
          git add data/periodic_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: refresh videos [skip ci]"
          # Another refresh can finish while this one is fetching. On a
          # generated-data conflict, keep this run's newer generated data.
          git pull --rebase -X theirs origin main
          git push
